[package]
name = "apeireth-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Canonical HTTP gateway adapter for the Apeireth runtime"
keywords = ["ai", "gateway", "http", "runtime"]
categories = ["api-bindings"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "macros", "time", "net"] }
axum = { version = "0.7", features = ["macros"] }
async-trait = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }
apeireth-core = { path = "../../foundation/core" }
apeireth-protocol = { path = "../../foundation/protocol" }
apeireth-runtime = { path = "../../engine/runtime" }
apeireth-guard = { path = "../../engine/guard" }
sha2 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
async-trait = { workspace = true }
uuid = { workspace = true }
apeireth-governance = { path = "../../foundation/governance" }
apeireth-plugin = { path = "../../foundation/plugin" }
apeireth-provider = { path = "../../engine/provider" }
reqwest = { workspace = true }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lib]
name = "apeireth_gateway"
path = "src/lib.rs"

[lints]
workspace = true
