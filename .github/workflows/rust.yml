name: Rust tests (OS matrix + cargo-nextest)

# R25 Stage 1: 独立 rust tests workflow (qdrant 模式)
# 抄自: qdrant/.github/workflows/rust.yml
# 模板: https://github.com/qdrant/qdrant/blob/master/.github/workflows/rust.yml
# 借鉴: tokio ci.yml [test-tokio-full] / [test-workspace-all-features] job
# 借鉴: wasmtime main.yml [ci] job
#
# 跟 rust-ci.yml 的关系 (R25 Agent D 2026-08-10):
#   - rust-ci.yml = 旧"一锅炖"R18 升级版 (OS matrix + nextest + release-build + battle-1-2 + ci-summary)
#   - rust.yml = 新 qdrant 风格"仅测试"workflow (本文件)
#   - 两者临时并存 1 周 (per R25 硬约束 #6: 保留 fallback)
#   - R26+ 续: 主人拍板后从 rust-ci.yml 删 rust-tests job, 单一来源
#
# 验收 (按 qdrant rust.yml 1:1):
#   - 3 OS matrix (ubuntu-latest + windows-latest + macos-latest) × stable
#   - cargo build --workspace --tests --locked exit 0
#   - cargo nextest run --workspace --profile ci --locked exit 0
#   - JUnit XML 上传 artifact (target/nextest/ci/junit.xml)

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

permissions:
  contents: read

jobs:
  rust-tests:
    name: cargo nextest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Verify current workspace does not reach legacy/
        run: python scripts/check_no_legacy_deps.py

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # keyring/dbus/wayland/pipewire 需要系统库 (仅 Linux)
      - name: "Install system deps (Linux: libdbus + libwayland + libpipewire)"
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update && sudo apt-get install -y libdbus-1-dev libwayland-dev libpipewire-0.3-dev libspa-0.2-dev pkg-config
          pkg-config --exists libpipewire-0.3
          pkg-config --modversion libpipewire-0.3

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - uses: Swatinem/rust-cache@v2
        with:
          # FIXME: macOS cache bin 临时关 (Swatinem/rust-cache#341)
          cache-bin: ${{ matrix.os != 'macos-latest' }}

      - name: cargo build --workspace --tests --locked
        run: cargo build --workspace --tests --locked

      - name: cargo nextest run --workspace --profile ci --locked
        # profile "ci" 在 .config/nextest.toml 定义 (fail-fast + retries 2)
        run: cargo nextest run --workspace --profile ci --locked

      - name: Canonical process isolation integration tests
        run: cargo test -p apeireth-tools-canonical --test process_executor --locked -- --nocapture

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextest-junit-${{ matrix.os }}.xml
          path: target/nextest/ci/junit.xml
          retention-days: 14

  # === 8 硬墙守门 (per CONTRIBUTING.md §0 触碰实查) ===
  # 跟 companion-desktop-ci.yml 平行, 但只盯根 workspace
  hard-walls:
    name: 8 硬墙守门 (LOCKED / version / baseline / 13 键 / V1136)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect base SHA
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base_sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            # push event: 取上一次 commit (排除自身)
            BASE=$(git rev-parse HEAD~1)
            # 若首次 commit, fallback 到空
            if [ -z "$BASE" ] || [ "$BASE" = "HEAD" ]; then
              BASE=$(git rev-list --max-parents=0 HEAD)
            fi
            echo "base_sha=$BASE" >> "$GITHUB_OUTPUT"
          fi

      - name: "守门 1: 0 触碰 24 LOCKED crate (pure fmt diff 放行)"
        env:
          BASE: ${{ steps.base.outputs.base_sha }}
        run: |
          if [ -z "$BASE" ]; then
            echo "::warning::base_sha 空, 跳过守门 1"
            exit 0
          fi
          # 24 LOCKED crate (per 8 硬墙 + CODEOWNERS 1:1)
          # 注: 之前 hard-walls job 漏了 apeireth-graph (commit 71984e03 CODEOWNERS sync 发现)
          LOCKED="apeireth-supervisor apeireth-agent apeireth-council apeireth-bus apeireth-protocol apeireth-mcp apeireth-tool-registry apeireth-tool-runtime apeireth-graph apeireth-pipeline apeireth-tool-approval apeireth-extension apeireth-evolution apeireth-api apeireth-core apeireth-memory apeireth-asi apeireth-tools apeireth-cli apeireth-bench apeireth-cognition apeireth-action apeireth-life-force apeireth-constraint"
          LOCKED_REGEX=$(echo "$LOCKED" | tr ' ' '|')
          HITS=$(git diff --name-only "$BASE"...HEAD -- 'crates/*.rs' 'crates/*/Cargo.toml' 2>/dev/null | grep -E "^crates/($LOCKED_REGEX)/" || true)
          if [ -z "$HITS" ]; then
            echo "✅ 0 触碰 24 LOCKED crate"
            exit 0
          fi
          # 守门宽限: pure fmt diff (whitespace-only 重排) 放行
          # 理由: 8 哲学锚 S-2 实事求是 + O-5 不假装 — fmt 是工具链, 0 改 logic;
          #       R148 (2026-08-13) 24 LOCKED 已形式撤销, fmt 触碰不应触发 exit 1.
          # 检测方法: git diff --word-diff=porcelain 输出 ~ (whitespace-only) / + / - line
          #       - 全 ~ 无 +/- = pure whitespace 重排 (rustfmt default), 放行
          #       - 任何 + / - line (新增/删除 word) = 真的 logic 改, 人工 review 必要
          HARD_HIT=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            # 仅 .rs 文件做内容比较; .toml 文件 (Cargo.toml) 不进 fmt 检查
            case "$f" in
              *.rs) ;;
              *) echo "  logic 改 (非 .rs): $f"; HARD_HIT="$HARD_HIT$f\n"; continue;;
            esac
            # 提取 word-diff 的 +/- 行 (排除 ~ 纯 whitespace)
            # git diff --word-diff=porcelain 格式:
            #   ~ 行: 仅空白变化 (rustfmt default 折行)
            #   + 行: 新增 word
            #   - 行: 删除 word
            WORD_DIFF=$(git diff --word-diff=porcelain "$BASE"...HEAD -- "$f" 2>/dev/null | grep -E '^[+-][^-+~ ]' || true)
            if [ -z "$WORD_DIFF" ]; then
              echo "  pure fmt: $f (无 +/- word 改, 仅 whitespace 重排, 放行)"
            else
              echo "  logic 改: $f (有 word-level 增删, 必须人工 review):"
              echo "$WORD_DIFF" | head -5
              HARD_HIT="$HARD_HIT$f\n"
            fi
          done <<< "$HITS"
          if [ -n "$HARD_HIT" ]; then
            echo "::error::24 LOCKED crate logic 触碰 (非 fmt):"
            echo -e "$HARD_HIT" | grep -v '^$'
            exit 1
          fi
          echo "✅ 24 LOCKED crate 仅纯 fmt 改 (logic 0 触碰)"

      - name: "守门 2: workspace.version matches release authority"
        env:
          BASE: ${{ steps.base.outputs.base_sha }}
        run: |
          if [ -z "$BASE" ]; then exit 0; fi
          CUR=$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml | grep -E '^version\s*=' | head -1 | sed 's/.*"\(.*\)".*/\1/')
          PREV=$(git show "$BASE:Cargo.toml" 2>/dev/null | sed -n '/^\[workspace\.package\]/,/^\[/p' | grep -E '^version\s*=' | head -1 | sed 's/.*"\(.*\)".*/\1/' || echo "")
          echo "workspace.version: prev=$PREV cur=$CUR"
          if [ -z "$CUR" ]; then
            echo "::error::workspace.version is missing"
            exit 1
          fi
          if [ -n "$PREV" ] && [ "$CUR" != "$PREV" ]; then
            echo "::error::workspace.version 改动: $PREV → $CUR"
            exit 1
          fi
          echo "✅ workspace.version 1.2.0 不变"

      - name: "守门 3: R11 baseline 3 值 0.8682/0.8532/0.9063 不变"
        env:
          BASE: ${{ steps.base.outputs.base_sha }}
        run: |
          if [ -z "$BASE" ]; then exit 0; fi
          # R11 baseline 编译期 hardcode 在 integration test (非 src/)
          TARGET="legacy/donor/apeireth-asi/tests/integration_r_measure.rs"
          if [ ! -f "$TARGET" ]; then
            echo "::warning::$TARGET 不存在, 跳过"
            exit 0
          fi
          for VAL in 0.8682 0.8532 0.9063; do
            if ! grep -q "$VAL" "$TARGET"; then
              echo "::error::R11 baseline $VAL 在 $TARGET 缺失"
              exit 1
            fi
          done
          echo "✅ R11 baseline 3 值在 $TARGET 完整"

      - name: "守门 4: 13 键 守门 (verdict cache)"
        run: |
          # R128 后: 13 键实际在 crates/foundation/core/src/philosophy.rs (per R125-12 + 13c25025 升级)
          # 13 键 = PHL-01..PHL-06 (V3 9) + V4.1 3 + R125-12 NotUnoptimizable 1
          # 检测:
          #   1. 优先 grep 4 hash prefix (per 原 R14 V0.5 守门, 后向兼容)
          #   2. fallback: 检查 ALL_THIRTEEN_KEYS 数组 (新 V3 13 键定义) + 数字 13
          TARGETS=("legacy/donor/apeireth-asi/src/lib.rs" "crates/foundation/core/src/philosophy.rs")
          for TARGET in "${TARGETS[@]}"; do
            if [ ! -f "$TARGET" ]; then continue; fi
            for HASH_PREFIX in "9f86d081" "e3b0c442" "d4735e3a" "4e074085"; do
              if grep -q "$HASH_PREFIX" "$TARGET"; then
                echo "✅ 13 键 verdict 守门: 找到 $HASH_PREFIX in $TARGET"
                exit 0
              fi
            done
            # fallback: ALL_THIRTEEN_KEYS + 数字 13 (post-R128 13 键定义)
            if grep -q "ALL_THIRTEEN_KEYS\|ALL_TWELVE_KEYS\|NotUnoptimizable" "$TARGET"; then
              if grep -qE "13\b" "$TARGET"; then
                echo "✅ 13 键 verdict cache 守门 (fallback: ALL_THIRTEEN_KEYS + 13 in $TARGET)"
                exit 0
              fi
            fi
          done
          echo "::error::13 键 verdict cache 守门失败 (扫了 ${TARGETS[@]}, 4 hash + ALL_THIRTEEN_KEYS/13 fallback 都 miss)"
          exit 1

      - name: "守门 5: 0 触碰 V0.5 V1136 哲学守门"
        env:
          BASE: ${{ steps.base.outputs.base_sha }}
        run: |
          if [ -z "$BASE" ]; then exit 0; fi
          # V1136 是 apeireth-asi/src/lib.rs 里的常量名
          TARGET="legacy/donor/apeireth-asi/src/lib.rs"
          if [ ! -f "$TARGET" ]; then exit 0; fi
          HITS=$(git diff "$BASE"...HEAD -- "$TARGET" 2>/dev/null | grep -E '^\+.*V1136|^\-.*V1136' || true)
          if [ -n "$HITS" ]; then
            # 但允许新增使用, 只阻止 V0.5 移除
            if git diff "$BASE"...HEAD -- "$TARGET" 2>/dev/null | grep -E '^-.*V1136\b' | grep -v '^-.*//' > /dev/null; then
              echo "::error::V1136 哲学常量被删:"
              git diff "$BASE"...HEAD -- "$TARGET" | grep '^-.*V1136' | head -5
              exit 1
            fi
          fi
          echo "✅ V0.5 V1136 哲学守门完整"

      - name: "守门 6: companion-desktop 不污染 root workspace"
        env:
          BASE: ${{ steps.base.outputs.base_sha }}
        run: |
          if [ -z "$BASE" ]; then exit 0; fi
          # root Cargo.toml members 不能含 frontend/companion-desktop/src-tauri
          if grep -q 'frontend/companion-desktop' Cargo.toml; then
            echo "::error::root Cargo.toml members 包含 frontend/companion-desktop (污染)"
            exit 1
          fi
          # 若 src-tauri/Cargo.toml 改动了, 顶层 [workspace] 必须仍在
          if git diff --name-only "$BASE"...HEAD -- 'frontend/companion-desktop/src-tauri/Cargo.toml' | grep -q Cargo.toml; then
            if ! head -3 frontend/companion-desktop/src-tauri/Cargo.toml | grep -q '^\[workspace\]'; then
              echo "::error::companion-desktop/src-tauri/Cargo.toml 缺顶层 [workspace]"
              exit 1
            fi
          fi

  # === R215 防御层: Secret 扫描 (per docs/04-internal/secret-management-policy.md) ===
  # 4 层防御: pre-commit hook (本地) + CI gate (本 workflow) + GitHub Secret Scanning (平台, 主人启用) + .gitleaks.toml (gitleaks binary 装上时升级)
  # 当前用本地 PowerShell 扫描器 (gitleaks binary 因 release-assets DNS 阻塞装不上, 0 装 PASS 标注)
  # 扫描模式: scan-all (working tree) + scan-history (force-push 偷渡防御)
  secret-scan:
    name: Secret scan (R215 防御层, 借鉴 gitleaks pattern)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # scan-history 需要全历史

      - name: Install PowerShell
        shell: pwsh
        run: |
          sudo apt-get update
          sudo apt-get install -y powershell

      - name: "Secret scan: working tree (scan-all)"
        shell: pwsh
        run: pwsh scripts/secret-scan.ps1 -Mode scan-all

      - name: "Secret scan: git history (scan-history, 防御 force-push 偷渡)"
        shell: pwsh
        run: pwsh scripts/secret-scan.ps1 -Mode scan-history
