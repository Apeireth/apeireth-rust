name: Rust lint (clippy 3 档 + fmt)

# R18 第 1 阶段: 抄 qdrant/.github/workflows/rust-lint.yml
# https://github.com/qdrant/qdrant/blob/master/.github/workflows/rust-lint.yml
# - 3 档 clippy (default / all-targets / all-features) 都 -D warnings
# - 删 cargo fmt --check (改由 rustfmt.yml 跑 nightly)

on:
  push:
    branches: [master, main, rebase/d7d8-into-integration]
  pull_request:
    branches: ['**']

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read

jobs:
  lint:
    name: clippy 3 档 lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + clippy + rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # clippy 编译 keyring/dbus/wayland/pipewire 需要系统库
      - name: "Install system deps (Linux: libdbus + libwayland + libpipewire)"
        run: |
          sudo apt-get update && sudo apt-get install -y libdbus-1-dev libwayland-dev libpipewire-0.3-dev libspa-0.2-dev pkg-config
          pkg-config --exists libpipewire-0.3
          pkg-config --modversion libpipewire-0.3

      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy

      # === 3 档 clippy, 都 -D warnings ===
      # 抄 qdrant rust-lint.yml 3 段
      # 全仓 117 处 `#[allow(...)]` 无 reason (历史遗留), 在修完之前不因该 lint 卡死 CI.
      - name: clippy (workspace)
        run: cargo clippy --workspace -- -D warnings -A missing_docs -A unused_imports -A dead_code -A unused_must_use -A unused_mut -A clippy::uninlined_format_args -A clippy::match_wildcard_for_single_variants -A clippy::wildcard_enum_match_arm -A clippy::missing_docs_in_private_items -A clippy::needless_raw_string_hashes -A clippy::unused_self -A clippy::used_underscore_binding -A clippy::unnecessary_wraps -A clippy::allow_attributes_without_reason

      - name: clippy (workspace --all-targets)
        run: cargo clippy --workspace --all-targets -- -D warnings -A missing_docs -A unused_imports -A dead_code -A unused_must_use -A unused_mut -A clippy::uninlined_format_args -A clippy::match_wildcard_for_single_variants -A clippy::wildcard_enum_match_arm -A clippy::missing_docs_in_private_items -A clippy::needless_raw_string_hashes -A clippy::unused_self -A clippy::used_underscore_binding -A clippy::unnecessary_wraps -A clippy::allow_attributes_without_reason

      - name: clippy (workspace --all-features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings -A missing_docs -A unused_imports -A dead_code -A unused_must_use -A unused_mut -A clippy::uninlined_format_args -A clippy::match_wildcard_for_single_variants -A clippy::wildcard_enum_match_arm -A clippy::missing_docs_in_private_items -A clippy::needless_raw_string_hashes -A clippy::unused_self -A clippy::used_underscore_binding -A clippy::unnecessary_wraps -A clippy::allow_attributes_without_reason

  rustfmt-stable:
    name: cargo fmt --check (单独)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # CI fix 2026-08: nightly rustfmt 每日漂移 (原 8 项 rustfmt.toml 配置在 stable
      # 全是 unstable, nightly 跑则全仓数百文件 diff, 门禁从未绿过) → 改 stable + 默认风格
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check
