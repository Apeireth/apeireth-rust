[workspace]
resolver = "2"
exclude = ["legacy", "research"]
members = [
    "crates/foundation/core",
    "crates/foundation/protocol",
    "crates/foundation/plugin",
    "crates/foundation/governance",
    "crates/foundation/credentials",
    "crates/foundation/orchestration",
    "crates/engine/runtime",
    "crates/engine/runtime-assembly",
    "crates/engine/guard",
    "crates/engine/provider",
    "crates/engine/storage",
    "crates/engine/memory",
    "crates/engine/perception",
    "crates/engine/organ",
    "crates/capabilities/tools",
    "crates/adapters/gateway",
    "crates/adapters/cli",
    "crates/adapters/sdk",
]

# ============================================================================
# Workspace Package Metadata (R128-2 阶段 C 收尾, per decision-22 + #33 + #55 + #57 + #58)
# ----------------------------------------------------------------------------
# LICENSE 引用链 (Apache 2.0 §4(d) NOTICE 条款, per P13-1 OSS_NOTICE.md §0.1):
#   - 根目录 `LICENSE`         : Apache License 2.0 完整文本 (175 行, 2026-08-05 写入, P13-1 严守不动)
#   - 根目录 `LICENSE-MIT`     : MIT License 完整文本 (2026-09-03 新增, 双协议)
#   - 根目录 `NOTICE`           : 项目特有 attribution (66 行, R20 阶段 6, P13-1 严守不动)
#   - 根目录 `OSS_NOTICE.md`    : 借鉴源码 8/11 整合 + 决策链 (346 行, P13-1 R128 阶段 D 新写)
#   - 根目录 `THIRD-PARTY-NOTICES.md` : cargo-about 0.8.4 生成 561 crates 第三方 attribution
#                                       (1709 lines / 12 unique SPDX / 0 cargo-deny violation, 2026-08-06)
#
# 借鉴源码 8/11 ✅ cloned (per decision-36 §1.1 + decision-47 §3.1 + decision-55 §3 + decision-58 §1.3):
#   ✅ 7 真实施 + ⏳ 3 限流持续 (LiteLLM/opencode/Guardrails P6-1/2/3 21:18 派) + ❌ 1 跳过 (OpenCog AGPL-3.0)
#   详见 [workspace.metadata.apeireth] §borrow 段
#
# Cargo.toml license field 0 装 PASS 严守 verify (P15-1 R128-2 阶段 C):
#   - [workspace.package] license = "Apache-2.0 OR MIT"  ← 主仓 license 单一来源 (双协议, 2026-09-03 拍板)
#   - 90+ sub-crate 中 65+ 已用 `license.workspace = true` 继承
#   - 27 skeleton 阶段硬编码 (license = "Apache-2.0" + version 硬编码 0.1.0/1.0.0) = **已知 TODO, 1.0 release 后清**
#     (per decision-22 §2.2 B2 1.2.0 严守 → 0 改 version 边界 + P15-1 0 主动 commit 严守 → 0 改 27 crate scope creep)
# ============================================================================
[workspace.package]
version = "2.0.0-rc.1"
edition = "2021"
rust-version = "1.97"  # 与 rust-toolchain.toml 对齐 (1.97.1), MSRV 诚实声明
authors = ["Apeireth Team"]
# 双协议 (2026-09-03 拍板): Apache-2.0 OR MIT, 任选其一; 完整文本见根目录 `LICENSE` / `LICENSE-MIT`
# Sub-crate 继承 = `license.workspace = true` (全部子 crate 已继承)
license = "Apache-2.0 OR MIT"
# SPDX 表达式 (per cargo + crates.io 推荐; dual license 惯例同 Rust 官方 / clap / PyO3 / kani)
repository = "https://github.com/Apeireth/Apeireth"
# 1.0 release 描述 (per decision-22 §3 + decision-57 §0 + decision-58 §0 + 2026-08-19 subagent 验证)
# 借鉴 8/11 + 24 LOCKED (per R148 仅保 3 不可变脊柱) + 8 哲学锚 + V0.5 24 维 (30 维升级 R126 P1-4 未合入) + 9 重守门 v9 (lineage v6→v7→v8→v9) + 13 键 verdict cache = 1.0 release
description = "Apeireth — AGI 操作系统 / LLM 基地（Rust）。v2.0 工程重构线：17-crate 单一工作区（foundation/engine/capabilities/adapters）+ runtime kernel/assembly + canonical agent loop + 受控工具与进程边界；设计/哲学/愿景沿袭 v1.0（8 哲学锚 + 三洋葱 + 13 键 + 0 装 PASS，v1 历史详单见 docs/archive/）"
homepage = "https://github.com/Apeireth/Apeireth"
keywords = ["ai", "agent", "autopoietic", "principle-onion", "permission-onion", "long-lived-ai", "growth-platform"]
categories = ["ai", "asynchronous", "compilers"]

