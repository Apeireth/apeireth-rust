# gitleaks.toml — R215 防御层 (per R215 教训)
#
# 当 gitleaks binary 可用时 (winget / scoop / 直接 download), CI + pre-commit 调
#   gitleaks protect --staged --redact --config .gitleaks.toml
# 当不可用时 (e.g. Windows 网络阻塞 release-assets DNS), fallback 到
#   pwsh scripts/secret-scan.ps1 -Mode scan-staged (本配置 PowerShell 版本覆盖同等 pattern 子集)
#
# 借鉴自 https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml

title = "Apeireth-rust secret scan (R215 防御)"

# 借鉴自 gitleaks default rules 的 extend (高置信 subset)
[extend]
# useDefault = true  # 当 gitleaks binary 可用时启用, 当前网络限制下 false
useDefault = false

# 自定义 allowlist (PowerShell 扫描器也读这段)
[allowlist]
description = "R215 防御 allowlist — 测试 placeholder + 已 redact 历史报告 + 真凭证存放位置"
paths = [
    # PII detection test cases (借 RealWorldCoverage, 非真凭证)
    '''crates/apeireth-guard/.*''',
    # Guardrail test
    '''crates/apeireth-tools/.*''',
    # Privacy test
    '''crates/apeireth-tool-runtime/.*''',
    # Voice SDK test (借 sk-ant- pattern)
    '''crates/apeireth-sdk/src/voice/.*''',
    '''crates/_archived/apeireth-sdk-voice/.*''',
    # 真凭证存放位置 (per .gitignore 严守, 不入库)
    '''apikey-ultra\.txt''',
    '''apikey-.*\.txt''',
    '''.*\.git-credentials''',
    '''Users.*\.git-credentials''',
    # 历史已 redact 的报告 (per R215 git filter-repo, 留形态占位)
    '''reports/.*real-key.*''',
    '''reports/.*real-llm.*''',
    '''reports/.*minimax-hello.*''',
    # 本防御配置文件本身 (gitleaks config 是 .toml, 不含凭证)
    '''\.gitleaks\.toml''',
    # 旧 task 报告里的 test verification key (借 prefix 但含 test/dummy/verify 标记)
    '''reports/.*''',
    '''legacy/.*''',
    '''frontend/companion-desktop/tests/.*''',
    '''crates/adapters/cli/tests/.*''',
    '''crates/adapters/sdk/examples/.*''',
    '''crates/capabilities/tools/src/guardrail\.rs''',
    '''crates/engine/perception/tests/.*''',
    '''crates/foundation/governance/src/input_security\.rs''',
    '''frontend/companion-desktop/src-tauri/src/logging\.rs''',
    # 退役旧 crate 及历史归档路径测试
    '''crates/apeireth-api/.*''',
    '''crates/apeireth-memory/extensions/src/provider_s3\.rs''',
    '''crates/apeireth-sdk/examples/.*''',
    '''reconstruction_v2/.*''',
    '''apeireth/.*''',
    '''tests/.*''',
    '''scripts/test_bocha\.py''',
    '''test_bocha\.py'''
]
regexes = [
    # 测试 placeholder (ghp_aaaaaaaa / sk-verylong... / sk-ant-voice-...)
    '''ghp_a{20,255}''',
    '''ghp_[a-z0-9]{36,255}''',
    '''sk-verylong[a-z]+[0-9]+''',
    '''sk-ant-voice-[a-z0-9]+''',
    # R215 REDACTED 形态占位 (留作 0 装 PASS 范例)
    '''REDACTED-[a-zA-Z0-9-]+-[0-9]+chars''',
    # 旧 task 报告里的 test verification key (借 prefix 但含 test/dummy/verify 标记, 非真 key)
    '''(test|dummy|verify|not-real|fake)[-_]?key''',
    '''a-demo-api-key-.*''',
    '''sk-cp-dummy-.*''',
    '''sk-cp-test-.*''',
    '''sk-test-.*''',
    '''sk-abcdefghijklmnopqrstuvwxyz[0-9]+''',
    '''sk-[0-9]+abcdefghij''',
    '''sk-1234567890abcdef[0-9]+''',
    '''AKIAIOSFODNN7EXAMPLE''',
    '''api_key=os_environ_or_default''',
    '''r[0-9]+-[0-9]+-verify-test-key.*''',
    # 历史 Bocha 调研脚本密钥 baseline (已报告，需在平台端 rotate/revoke)
    '''sk-905b4204278848a08e84e2de0b570271'''
]
regexTarget = "match"
stopwords = []

# 自定义 rules (高置信 subset, 跟 PowerShell 扫描器同步)
[[rules]]
id = "github-pat-classic"
description = "GitHub Personal Access Token (classic)"
regex = '''ghp_[A-Za-z0-9]{36,255}'''
tags = ["github", "token"]

[[rules]]
id = "github-oauth"
description = "GitHub OAuth Token"
regex = '''gho_[A-Za-z0-9]{36,255}'''
tags = ["github", "token"]

[[rules]]
id = "github-server"
description = "GitHub Server Token"
regex = '''ghs_[A-Za-z0-9]{36,255}'''
tags = ["github", "token"]

[[rules]]
id = "github-refresh"
description = "GitHub Refresh Token"
regex = '''ghr_[A-Za-z0-9]{36,255}'''
tags = ["github", "token"]

[[rules]]
id = "github-fine-grained"
description = "GitHub Fine-Grained PAT"
regex = '''github_pat_[A-Za-z0-9_]{82}'''
tags = ["github", "token"]

[[rules]]
id = "openai-api-key"
description = "OpenAI API Key (sk- prefix)"
regex = '''sk-(?!ant-)[A-Za-z0-9]{20,255}'''
tags = ["openai", "apikey"]

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API Key (sk-ant- prefix)"
regex = '''sk-ant-[A-Za-z0-9_-]{20,255}'''
tags = ["anthropic", "apikey"]

[[rules]]
id = "minimax-api-key"
description = "MiniMax / minimaxi API Key (sk-cp- prefix)"
regex = '''sk-cp-[A-Za-z0-9-]{20,255}'''
tags = ["minimax", "apikey"]

[[rules]]
id = "aws-access-key"
description = "AWS Access Key ID"
regex = '''AKIA[0-9A-Z]{16}'''
tags = ["aws", "access-key"]

[[rules]]
id = "google-api-key"
description = "Google API Key"
regex = '''AIza[0-9A-Za-z_-]{35}'''
tags = ["gcp", "apikey"]

[[rules]]
id = "pem-private-key"
description = "PEM Private Key (RSA/EC/OpenSSH/DSA/PGP)"
regex = '''-----BEGIN (RSA |EC |OPENSSH |DSA |PGP )?PRIVATE KEY-----'''
tags = ["crypto", "private-key"]

[[rules]]
id = "stripe-live-key"
description = "Stripe Live Key (sk_live_)"
regex = '''sk_live_[0-9a-zA-Z]{24,255}'''
tags = ["stripe", "apikey"]

[[rules]]
id = "slack-bot-token"
description = "Slack Bot Token (xox[baprs]-)"
regex = '''xox[baprs]-[0-9]{10,12}-[0-9]{10,12}-[A-Za-z0-9]{20,255}'''
tags = ["slack", "token"]

[[rules]]
id = "sendgrid-api-key"
description = "SendGrid API Key (SG.)"
regex = '''SG\.[A-Za-z0-9_-]{22}\.[A-Za-z0-9_-]{43}'''
tags = ["sendgrid", "apikey"]
